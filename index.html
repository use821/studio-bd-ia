<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Anime Face Transformer - Comic AI Studio</title>

<style>

body {

background:#111;
color:white;
font-family:Georgia;
font-style:italic;
text-align:center;
padding:40px;

}


h1 {

font-size:45px;

}


.zone {

background:rgba(255,255,255,0.1);

padding:30px;

border-radius:20px;

max-width:600px;

margin:auto;

}


input {

margin:20px;

font-size:18px;

}


button {

padding:15px 30px;

border-radius:30px;

font-size:18px;

cursor:pointer;

}


#preview {

margin-top:30px;

max-width:300px;

border-radius:20px;

display:none;

}


</style>

</head>


<body>


<h1>⚡ Anime Face Transformer ⚡</h1>

<p>
Transforme un visage réel en personnage d'anime
</p>


<div class="zone">


<input 
type="file"
id="photo"
accept="image/*"
>


<br>


<button onclick="transformer()">
Transformer en Anime
</button>


<br>


<img id="preview">


</div>




<script>


function transformer(){


let fichier =
document.getElementById("photo").files[0];


if(!fichier){

alert("Choisis une image");

return;

}



let image =
document.getElementById("preview");


image.src =
URL.createObjectURL(fichier);


image.style.display="block";



alert(
"L'image est prête pour la transformation IA Anime."
);


}


</script>


</body>

</html>

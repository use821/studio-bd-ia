<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Comic AI Studio</title>

<style>
body 
<p>Studio BD IA en construction</p>
    font-family: Arial, sans-serif;
    background:#f5f5f5;
    text-align:center;
    padding:40px;
}

.container {
    background:white;
    padding:30px;
    border-radius:15px;
    max-width:700px;
    margin:auto;
}

textarea {
    width:90%;
    height:120px;
    padding:10px;
}

button {
    margin-top:20px;
    padding:15px 30px;
    background:#222;
    color:white;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

#result {
    margin-top:30px;
    font-size:18px;
}
</style>

</head>

<body>

<div class="container">

<h1>🎨 Comic AI Studio</h1>

<h2>Créateur de BD avec IA</h2>

<p>Décris ton histoire :</p>

<textarea id="story" placeholder="Exemple : Un jeune héros découvre une cité magique..."></textarea>

<br>

<button onclick="createComic()">
Créer ma BD
</button>

<div id="result"></div>

</div>


<script>

function createComic(){

let text = document.getElementById("story").value;

document.getElementById("result").innerHTML =
"📖 Création de ta BD : <br><br>" + text;

}

</script>

</body>
</html>
